name: CI/CD Pipeline

on:
  push:
    branches:
      - backup
      - dev
      - tin
  pull_request:
    branches:
      - dev

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Backend Dependencies
        run: |
          cd app
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd client
          npm install

      - name: Build Frontend
        run: |
          cd client
          npm run build

  deploy:
    name: Deploy to Render
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "Error: RENDER_DEPLOY_HOOK secret is not set."
            exit 1
          fi
          # Deploy Backend
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          
          # Deploy Frontend (Nếu có cấu hình)
          if [ -n "${{ secrets.RENDER_FRONTEND_HOOK }}" ]; then
            echo "Triggering Frontend Deploy..."
            curl -X POST "${{ secrets.RENDER_FRONTEND_HOOK }}"
          fi
